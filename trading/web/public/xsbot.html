<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>רובוט מומנטום</title>
  <style>
    :root { --bg: #070a0e; --panel: #0e131a; --line: #1c242e; --text: #d6dde4; --muted: #6e7c8a; --up: #26a69a; --down: #ef5350; --accent: #4c8dff; --warn: #f0b90b; color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.6 system-ui, 'Segoe UI', sans-serif; padding: 16px; }
    .wrap { max-width: 920px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
    h1 { font-size: 22px; margin: 0; }
    h2 { font-size: 16px; margin: 0 0 8px; }
    .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px; }
    .muted { color: var(--muted); }
    .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
    .stat { flex: 1 1 140px; border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; }
    .stat .v { font-size: 22px; font-weight: 700; direction: ltr; text-align: start; unicode-bidi: plaintext; }
    .up { color: var(--up); } .down { color: var(--down); }
    button { font: inherit; padding: 8px 18px; border-radius: 6px; border: 1px solid var(--line); cursor: pointer; color: #fff; }
    .on { background: #1e6b52; } .off { background: #7a2b2b; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { border-bottom: 1px solid var(--line); padding: 5px 8px; text-align: start; }
    th { color: var(--muted); font-weight: 600; }
    td.n { direction: ltr; text-align: end; font-variant-numeric: tabular-nums; }
    .scroll { overflow-x: auto; }
    .log { max-height: 260px; overflow-y: auto; font-size: 13px; }
    .log div { padding: 2px 0; border-bottom: 1px solid var(--line); }
  </style>
</head>
<body>
<div class="wrap">
  <h1>רובוט מומנטום ניטרלי לשוק — בדיקה בחשבון תרגול</h1>
  <div class="panel">
    <div class="row">
      <div style="flex:1"><b id="phase">—</b><div class="muted" id="verdict"></div></div>
      <button id="toggle">—</button>
    </div>
    <div class="muted" style="margin-top:8px" id="rules"></div>
  </div>
  <div class="panel">
    <div class="row">
      <div class="stat"><div class="muted">ימי מסחר שנספרו</div><div class="v" id="days">—</div></div>
      <div class="stat"><div class="muted">תוצאה מצטברת (יחידות סיכון)</div><div class="v" id="r">—</div></div>
      <div class="stat"><div class="muted">תוצאה מצטברת ($)</div><div class="v" id="pnl">—</div></div>
      <div class="stat"><div class="muted">ירידה מהשיא</div><div class="v" id="dd">—</div></div>
      <div class="stat"><div class="muted">היום, פוזיציות פתוחות ($)</div><div class="v" id="open">—</div></div>
      <div class="stat"><div class="muted">הון חשבון הרובוט</div><div class="v" id="eq">—</div></div>
    </div>
  </div>
  <div class="panel">
    <h2>העסקאות של היום</h2>
    <div class="scroll"><table><thead><tr><th>מניה</th><th>כיוון</th><th>כמות</th><th>מחיר בהחלטה</th><th>מחיר ביצוע</th><th>תוצאה ($)</th><th>הערה</th></tr></thead><tbody id="legs"></tbody></table></div>
  </div>
  <div class="panel">
    <h2>היסטוריה יומית</h2>
    <div class="scroll"><table><thead><tr><th>תאריך</th><th>עסקאות</th><th>תוצאה ($)</th><th>יחידות סיכון</th></tr></thead><tbody id="hist"></tbody></table></div>
  </div>
  <div class="panel">
    <h2>יומן</h2>
    <div class="log" id="log"></div>
  </div>
  <div class="muted" id="updated"></div>
</div>
<script>
  const $ = (id) => document.getElementById(id);
  const money = (n) => (n < 0 ? '−$' : '$') + Math.abs(n).toLocaleString('en-US', { maximumFractionDigits: 2 });
  const sign = (n) => (n > 0 ? '+' : n < 0 ? '−' : '') + Math.abs(n).toFixed(2);
  const cls = (n) => (n > 0 ? 'up' : n < 0 ? 'down' : '');
  const time = new Intl.DateTimeFormat('he-IL', { timeZone: 'Asia/Jerusalem', day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit' });
  let enabled = false;
  function setVal(id, text, n) { const el = $(id); el.textContent = text; el.className = 'v ' + (n === undefined ? '' : cls(n)); }
  async function load() {
    try {
      const r = await fetch('/api/xsbot', { cache: 'no-store' });
      const s = await r.json();
      if (!r.ok) throw new Error(s.error || r.status);
      enabled = s.enabled;
      $('phase').textContent = s.phase;
      $('verdict').textContent = s.summary.verdict;
      const t = $('toggle');
      t.textContent = s.enabled ? 'כיבוי הרובוט' : 'הפעלת הרובוט';
      t.className = s.enabled ? 'off' : 'on';
      t.disabled = !s.available || (!!s.halted && !s.enabled);
      const p = s.params;
      $('rules').textContent = `כל יום ב-${s.decisionTime} (שעון ישראל): קנייה של ${p.K} המניות הנזילות החזקות מהפתיחה ושורט של ${p.K} החלשות, סיכון $${p.riskPerLeg} למניה, בלי סטופ, סגירה 5 דקות לפני סוף המסחר. החלטה אחרי ${p.evalDays} ימים: ‎+${p.confirmR}R ומעלה = אושרה, 0 ומטה = נכשלה, ירידה של ${p.maxDrawdownR}R = עצירה.`;
      setVal('days', `${s.summary.days} / ${p.evalDays}`);
      setVal('r', sign(s.summary.r), s.summary.r);
      setVal('pnl', money(s.summary.pnl), s.summary.pnl);
      setVal('dd', sign(s.summary.drawdownR) + 'R', s.summary.drawdownR);
      setVal('open', money(s.summary.openPnl), s.summary.openPnl);
      setVal('eq', s.account ? money(s.account.equity) : '—');
      const today = [...s.days].reverse()[0];
      $('legs').innerHTML = today ? today.legs.map((l) => `<tr><td>${l.symbol}</td><td>${l.side === 'long' ? 'קנייה' : 'שורט'}</td><td class="n">${l.qty}</td><td class="n">${l.decisionPx}</td><td class="n">${l.fillPx ?? '—'}</td><td class="n ${cls(l.pnl ?? 0)}">${l.pnl === undefined ? '—' : money(l.pnl)}</td><td>${l.note ?? ''}</td></tr>`).join('') || '<tr><td colspan="7" class="muted">אין עסקאות</td></tr>' : '<tr><td colspan="7" class="muted">עוד לא התחיל</td></tr>';
      $('hist').innerHTML = [...s.days].reverse().filter((d) => d.done).map((d) => `<tr><td>${d.date}</td><td class="n">${d.legs.length}</td><td class="n ${cls(d.pnl)}">${money(d.pnl)}</td><td class="n ${cls(d.r)}">${sign(d.r)}</td></tr>`).join('') || '<tr><td colspan="4" class="muted">עוד אין ימים שהסתיימו</td></tr>';
      $('log').innerHTML = s.log.map((l) => `<div><span class="muted">${time.format(new Date(l.ts))}</span> · ${l.msg}</div>`).join('');
      $('updated').textContent = `עודכן ${time.format(new Date())} · מתעדכן לבד כל 5 שניות`;
    } catch (e) {
      $('updated').textContent = 'אין חיבור לשרת המערכת. ודא שהיא פועלת (הסמל בשולחן העבודה).';
    }
  }
  $('toggle').onclick = async () => {
    const r = await fetch('/api/xsbot', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ enabled: !enabled }) });
    if (!r.ok) alert((await r.json()).error || 'שגיאה');
    load();
  };
  load();
  setInterval(load, 5000);
</script>
</body>
</html>
